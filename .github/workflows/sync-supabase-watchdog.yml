# .github/workflows/sync-supabase-watchdog.yml
name: Verify today's snapshot exists
on:
  # 주 경로: 데이터 파이프라인이 끝나는 즉시 검증한다. 고정 시각 대신 이걸 쓰는
  # 이유는 파이프라인 실행이 GitHub 스케줄 지연으로 몇 시간씩 밀리기 때문.
  # ▶ workflows 의 문자열은 weekly-json-update.yml 의 `name:` 과 정확히 일치해야
  #   한다. 그 name 을 바꾸면 이 트리거가 조용히 죽는다(대응 주석을 그쪽에도 달아둠).
  workflow_run:
    workflows: ["Weekday JSON Update"]
    types: [completed]
  # 안전망: 파이프라인이 아예 안 돈 날을 잡는다. 기존 KST 17:00 은 파이프라인이
  # 밀리면 무의미해서 KST 22:00 으로 늦춤.
  schedule:
    - cron: "0 13 * * 1-5"   # 평일 UTC 13:00 = KST 22:00
  workflow_dispatch:
    inputs:
      force_fail:
        description: "true면 실제 데이터 상태와 무관하게 강제로 실패시켜 슬랙 알림 경로만 테스트한다"
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install @supabase/supabase-js
        continue-on-error: false

      # 스크립트 파일이 없어서 감시가 10일간 꺼져 있던 적이 있다("Cannot find
      # module"은 원인이 안 보인다). 없으면 명확한 문구로 즉시 실패시킨다.
      - name: Assert watchdog script is present
        run: |
          missing=0
          for f in scripts/verify-today-ingested.mjs scripts/lib/market-calendar.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::워치독 파일 없음: $f - 삭제/이동/미배포 여부 확인. 감시가 꺼진 상태다."
              missing=1
            fi
          done
          exit $missing

      - name: Verify today's snapshot
        run: node scripts/verify-today-ingested.mjs
        continue-on-error: false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE_FAIL: ${{ inputs.force_fail && '1' || '' }}

      # 주의: verify-today-ingested.mjs는 데이터 검증 실패 시 스스로도 슬랙을
      # 보낸다(원인/실측값 포함). 이 스텝은 그 스크립트 실행 자체가 죽었을 때
      # (예: npm install 실패, 네트워크 문제)를 잡는 별개의 안전망이라 데이터
      # 검증 실패 케이스에서는 알림이 2번(원인 상세 + 이 일반 알림) 갈 수 있다.
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
