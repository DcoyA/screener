# .github/workflows/sync-supabase-watchdog.yml
name: Verify today's snapshot exists
on:
  schedule:
    - cron: "0 8 * * 1-5"   # 평일 UTC 08:00 = KST 17:00
  workflow_dispatch:
    inputs:
      force_fail:
        description: "true면 실제 데이터 상태와 무관하게 강제로 실패시켜 슬랙 알림 경로만 테스트한다"
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install @supabase/supabase-js
        continue-on-error: false

      - name: Verify today's snapshot
        run: node scripts/verify-today-ingested.mjs
        continue-on-error: false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE_FAIL: ${{ inputs.force_fail && '1' || '' }}

      # 주의: verify-today-ingested.mjs는 데이터 검증 실패 시 스스로도 슬랙을
      # 보낸다(원인/실측값 포함). 이 스텝은 그 스크립트 실행 자체가 죽었을 때
      # (예: npm install 실패, 네트워크 문제)를 잡는 별개의 안전망이라 데이터
      # 검증 실패 케이스에서는 알림이 2번(원인 상세 + 이 일반 알림) 갈 수 있다.
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
