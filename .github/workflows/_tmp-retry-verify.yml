name: TEMP - Retry Verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fail intentionally
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          timeout_minutes: 2
          command: echo "시도 실행됨 - 일부러 실패" && exit 1
