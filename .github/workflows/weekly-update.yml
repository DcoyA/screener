name: Weekday JSON Update

on:
  schedule:
    - cron: "7 0 * * 1-5" # 09:07 KST weekdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekday-json-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      KRX_KOSPI_BASIC_URL: ${{ vars.KRX_KOSPI_BASIC_URL }}
      KRX_KOSDAQ_BASIC_URL: ${{ vars.KRX_KOSDAQ_BASIC_URL }}
      KRX_KOSPI_DAILY_URL: ${{ vars.KRX_KOSPI_DAILY_URL }}
      KRX_KOSDAQ_DAILY_URL: ${{ vars.KRX_KOSDAQ_DAILY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Ensure data directories exist
        run: |
          mkdir -p app/data
          mkdir -p data

      - name: Run update_data.py
        run: python scripts/update_data.py

      - name: Generate market state JSON
        run: |
          python scripts/generate_market_state.py             --stocks app/data/stocks.json             --sector-map sectorMap.json             --override market_context_override.json             --output app/data/market_state.json

      - name: Show changed files
        run: git status --short

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/stocks.json app/data/history.json app/data/risks.json app/data/market_state.json || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update weekday JSON data"
          git push
