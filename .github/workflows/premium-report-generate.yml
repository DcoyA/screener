name: Premium Report - Generate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "LLM 호출 + zod 검증까지만. DB 쓰기·슬랙·메일·검수알림 전부 스킵."
        type: boolean
        default: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'scripts/premium/package-lock.json'

      - name: Install Node deps
        run: npm ci --prefix scripts/premium

      - name: Generate report
        run: node scripts/premium/generate-report.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Notify draft ready (사람 검수 요청 - 여기서 발송 안 함)
        if: ${{ success() && !inputs.dry_run }}
        run: node scripts/premium/notify-draft-ready.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EDITORIAL_PREVIEW_TOKEN: ${{ secrets.EDITORIAL_PREVIEW_TOKEN }}

      - name: Upload raw LLM responses (검증 실패 진단용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-llm-responses
          path: scripts/premium/raw-response-attempt*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: ${{ failure() && !inputs.dry_run }}
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
          retry_workflow: premium-report-generate.yml
