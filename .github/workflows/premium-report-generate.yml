name: Premium Report - Generate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "LLM 호출 + zod 검증까지만. DB 쓰기·슬랙·메일·검수알림 전부 스킵. (수동 UI 오클릭 방지용 기본 true)"
        type: boolean
        default: true
  # schedule 은 이 워크플로에 없다(수집은 premium-data-collect.yml). 나중에 추가돼도
  # 아래 'Resolve run mode'가 schedule 을 무조건 실발행으로 처리한다.
  # 실제 발행 회차는 슬랙 검수 승인 -> app/api/slack/interactions/route.js 가
  # workflow_dispatch 로 { dry_run: "false" } 를 명시 전달해 돌린다.

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "[모드] 실발행 (trigger=schedule)"
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "[모드] 실발행 (trigger=workflow_dispatch, dry_run=false)"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "[모드] dry-run (trigger=${{ github.event_name }}, dry_run=${{ inputs.dry_run }})"
          fi

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'scripts/premium/package-lock.json'

      - name: Install Node deps
        run: npm ci --prefix scripts/premium

      - name: Generate report
        run: node scripts/premium/generate-report.mjs ${{ steps.mode.outputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Notify draft ready (사람 검수 요청 - 여기서 발송 안 함)
        if: ${{ success() && steps.mode.outputs.dry_run == 'false' }}
        run: node scripts/premium/notify-draft-ready.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EDITORIAL_PREVIEW_TOKEN: ${{ secrets.EDITORIAL_PREVIEW_TOKEN }}

      - name: Upload raw LLM responses (검증 실패 진단용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-llm-responses
          path: scripts/premium/raw-response-attempt*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: ${{ failure() && steps.mode.outputs.dry_run == 'false' }}
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
          retry_workflow: premium-report-generate.yml
