name: Weekday JSON Update

on:
  schedule:
    - cron: "7 0 * * 1-5" # 09:07 KST weekdays
    # 백업 실행: 09:07 실행이 GitHub Actions 스케줄 지연/누락으로 안 돌았을 때
    # 대비. "check" 잡의 스킵 가드가 이미 오늘자 데이터가 있으면 알아서
    # 건너뛰므로, 정상적인 날엔 그냥 아무 일도 안 하고 끝난다.
    - cron: "7 2 * * 1-5" # 11:07 KST weekdays (백업)
  workflow_dispatch:
    inputs:
      krx_debug:
        description: "KRX 요청 URL/헤더/파라미터를 로그에 찍기(AUTH_KEY는 마스킹). 403 등 인증 문제 디버깅용"
        type: boolean
        default: false
      allow_shrink:
        description: "Supabase 이상치 가드(직전 스냅샷 대비 50% 미만이면 중단) 우회. 종목 수가 의도적으로 줄었을 때만 켤 것"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekday-json-update
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: 오늘 이미 갱신됐는지 확인
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          CURRENT=$(jq -r '.[0].updatedAt // empty' app/data/stocks.json 2>/dev/null || echo "")
          echo "오늘(KST)=$TODAY, stocks.json의 updatedAt=$CURRENT"
          if [ "$TODAY" = "$CURRENT" ]; then
            echo "이미 오늘자로 갱신됨 - 이번 실행은 스킵합니다(백업 cron 등 중복 실행 대비)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      KRX_KOSPI_BASIC_URL: ${{ vars.KRX_KOSPI_BASIC_URL }}
      KRX_KOSDAQ_BASIC_URL: ${{ vars.KRX_KOSDAQ_BASIC_URL }}
      KRX_KOSPI_DAILY_URL: ${{ vars.KRX_KOSPI_DAILY_URL }}
      KRX_KOSDAQ_DAILY_URL: ${{ vars.KRX_KOSDAQ_DAILY_URL }}
      KRX_KOSPI_INDEX_DAILY_URL: ${{ vars.KRX_KOSPI_INDEX_DAILY_URL }}
      KRX_DEBUG: ${{ inputs.krx_debug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies if requirements.txt exists
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, skipping dependency install"
          fi

      - name: Ensure data directories exist
        run: |
          mkdir -p app/data
          mkdir -p data

      - name: Verify required files
        run: |
          test -f scripts/update_data.py
          test -f scripts/update_etf_universe.py
          test -f scripts/generate_market_state.py
          test -f app/data/etf_master.json

      - name: Check fair-value v2 sector map (non-fatal)
        run: |
          if [ -f app/data/sector_map.json ]; then
            echo "sector_map.json 확인됨 - 섹터 부분회귀 목표가가 정상적으로 계산됩니다."
          else
            echo "::warning::app/data/sector_map.json 이 없습니다. update_data.py는 이 상태에서도 죽지 않지만" \
                 "모든 종목의 목표 PER이 섹터 기준이 아니라 시장 전체 중앙값(낮은 신뢰도) 기준으로 계산됩니다." \
                 "scripts/build_sector_map.py를 실행해 다시 만들어 커밋해주세요."
          fi

      - name: Run update_data.py
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 300
          timeout_minutes: 30
          command: python scripts/update_data.py

      - name: Build ETF universe
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 300
          timeout_minutes: 30
          command: python scripts/update_etf_universe.py

      - name: Generate market state JSON
        run: |
          python scripts/generate_market_state.py \
            --stocks app/data/stocks.json \
            --sector-map sectorMap.json \
            --override market_context_override.json \
            --output app/data/market_state.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies (npm ci)
        run: npm ci

      - name: Sync latest data to Supabase
        run: node scripts/ingest-daily-snapshot.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}

      - name: Show changed files
        run: git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/stocks.json app/data/history.json app/data/risks.json app/data/reports.json app/data/etf_universe.json app/data/market_state.json || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update weekday JSON data"

      - name: Discard incidental package.json/package-lock.json drift
        # npm ci는 원칙적으로 lockfile을 안 건드리지만, 혹시라도(npm 버전 차이 등으로)
        # 건드려서 unstaged로 남으면 git pull --rebase가 exit 128로 죽는다.
        # app/data/*.json은 위 Commit changes 단계에서 이미 커밋됐으므로,
        # 여기서 package.json/package-lock.json만 원복해도 다른 변경사항을
        # 건드리지 않는다.
        run: git checkout -- package.json package-lock.json || true

      - name: Pull latest changes
        run: git pull origin main --rebase --autostash

      - name: Push changes
        run: git push origin main

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
