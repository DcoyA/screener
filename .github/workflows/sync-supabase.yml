name: Sync stocks.json to Supabase
on:
  push:
    branches: [main]
    paths:
      - "app/data/stocks.json"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Supabase 이상치 가드(직전 스냅샷 대비 50% 미만이면 중단) 우회. 종목 수가 의도적으로 줄었을 때만 켤 것"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node scripts/ingest-daily-snapshot.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
