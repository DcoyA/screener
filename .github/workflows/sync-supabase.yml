# 수동 재적재 전용. 정규 적재는 weekly-json-update.yml 의 인라인 스텝
# ("Sync latest data to Supabase")이 담당한다.
# push 트리거는 GITHUB_TOKEN 정책상 동작하지 않아(봇 푸시는 on:push 를
# 트리거하지 않음) 제거했다. PAT 로 되살리면 인라인 스텝과 이중 적재되고
# 루프 위험이 있으므로 되살리지 말 것.
name: Sync stocks.json to Supabase
on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Supabase 이상치 가드(직전 스냅샷 대비 50% 미만이면 중단) 우회. 종목 수가 의도적으로 줄었을 때만 켤 것"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js
      - run: node scripts/ingest-daily-snapshot.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
