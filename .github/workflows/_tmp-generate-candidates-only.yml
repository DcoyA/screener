name: _tmp Generate Candidates Only

# TASK 6(슬랙 다중 선택) E2E 검증용 임시 워크플로. collect_disclosures.py가
# 별도 이슈로 타임아웃 중이라 전체 파이프라인(premium-data-collect.yml)을
# 못 도니, 후보 생성 + 슬랙 알림 두 스텝만 떼어서 실행한다. 검증 후 삭제할 것.

on:
  workflow_dispatch:
    inputs:
      force_day_type:
        type: string
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install @supabase/supabase-js

      - name: Generate topic candidates
        run: node scripts/premium/generate-topic-candidates.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_DAY_TYPE: ${{ inputs.force_day_type }}

      - name: Notify editor via Slack
        run: node scripts/premium/notify-editor.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
