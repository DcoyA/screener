name: Premium Report - Data Collect

on:
  schedule:
    - cron: "0 20 * * 0,1,3,4"  # UTC 기준, KST 월/화/목/금 오전 5시
  workflow_dispatch:
    inputs:
      force_day_type:
        description: "generate-topic-candidates.mjs의 day_type을 강제 지정(mon/tue/thu/fri). 평일 수동 검증용 - 비워두면 실제 KST 요일을 따름"
        type: string
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install pykrx supabase

      - name: Collect flow signals
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 300
          timeout_minutes: 30
          command: python scripts/premium/collect_flow_signals.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Collect disclosures
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 300
          timeout_minutes: 30
          command: python scripts/premium/collect_disclosures.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'scripts/premium/package-lock.json'

      - name: Install Node deps
        run: npm ci --prefix scripts/premium

      - name: Scan market issues
        run: node scripts/premium/scan_market_issues.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate topic candidates
        run: node scripts/premium/generate-topic-candidates.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_DAY_TYPE: ${{ inputs.force_day_type }}

      - name: Notify editor via Slack
        run: node scripts/premium/notify-editor.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}

