name: Premium Report - Data Collect

on:
  schedule:
    - cron: "0 20 * * 0,1,3,4"  # UTC 기준, KST 월/화/목/금 오전 5시
  workflow_dispatch:
    inputs:
      force_day_type:
        description: "generate-topic-candidates.mjs의 day_type을 강제 지정(mon/tue/thu/fri). 평일 수동 검증용 - 비워두면 실제 KST 요일을 따름"
        type: string
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 백오프 대기 최대 = 60+300+1200 = 26분. 재시도 스텝 2개 × (실행 최대 30분 × 3회
    # + 대기 26분) 이 이론상 상한이라 넉넉히 잡는다(기존엔 job timeout이 없었다).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        id: deps_py
        run: pip install -r scripts/premium/requirements-premium.txt

      - name: Collect flow signals
        id: collect_flow
        # 고정 300초 × 3회 대신 계단식 백오프(60/300/1200초 + 지터). 멱등성 가드가
        # 있어(FORCE 미설정 시 오늘자 있으면 exit 0) 전체 재실행이 안전하다.
        run: bash scripts/ci/retry-with-backoff.sh python scripts/premium/collect_flow_signals.py
        env:
          RETRY_DELAYS: "60 300 1200"
          RETRY_TIMEOUT: "1800"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Collect disclosures
        id: collect_disc
        run: bash scripts/ci/retry-with-backoff.sh python scripts/premium/collect_disclosures.py
        env:
          # timeout(exit 124)으로 죽으면 stdout 버퍼가 flush 안 돼 진행이 안 보인다.
          PYTHONUNBUFFERED: "1"
          RETRY_DELAYS: "60 300 1200"
          RETRY_TIMEOUT: "1800"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}

      # disclosure_events 에 이미 20만+ 행이 있어 당일 수집(Collect disclosures)이
      # timeout 으로 실패해도 후보 생성은 가능하다. gen_topics 가 node 로 도므로
      # 그 선행인 Node.js 설치/deps 도 실패해도 실행돼야 한다. Collect disclosures
      # 실패는 여전히 잡 전체를 red 로 만든다(continue-on-error 안 씀).
      - name: Set up Node.js
        if: success() || failure()
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'scripts/premium/package-lock.json'

      - name: Install Node deps
        id: deps_node
        if: success() || failure()
        run: npm ci --prefix scripts/premium

      # Scan market issues 는 조건을 안 붙인다. gen_topics 는 market_issues 를
      # DB(3일 창)에서 읽지 당일 스캔 결과를 필수로 요구하지 않으므로, 상류
      # 실패 시엔 그대로 skip 되게 둔다(부분 실패 뒤 LLM 호출을 아낀다).
      - name: Scan market issues
        id: scan
        run: node scripts/premium/scan_market_issues.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate topic candidates
        id: gen_topics
        if: success() || failure()
        run: node scripts/premium/generate-topic-candidates.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_DAY_TYPE: ${{ inputs.force_day_type }}

      # 후보가 생겨도 이 알림이 skip 되면 에디터가 슬랙에서 못 고른다 -> draft 안 나옴.
      - name: Notify editor via Slack
        id: notify_editor
        if: success() || failure()
        run: node scripts/premium/notify-editor.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          job_name: ${{ github.workflow }}
          retry_workflow: premium-data-collect.yml
          # Collect disclosures 뒤 몇 스텝은 실패해도(if: success() || failure())
          # 계속 돌므로 outcome=='failure'인 스텝이 둘 이상일 수 있다. 위에서부터
          # 처음 걸리는(= 근본 원인) 스텝 이름을 실어 보낸다.
          failed_step: >-
            ${{ steps.deps_py.outcome == 'failure' && 'Install Python deps'
             || steps.collect_flow.outcome == 'failure' && 'Collect flow signals'
             || steps.collect_disc.outcome == 'failure' && 'Collect disclosures'
             || steps.deps_node.outcome == 'failure' && 'Install Node deps'
             || steps.scan.outcome == 'failure' && 'Scan market issues'
             || steps.gen_topics.outcome == 'failure' && 'Generate topic candidates'
             || steps.notify_editor.outcome == 'failure' && 'Notify editor via Slack'
             || 'unknown' }}

